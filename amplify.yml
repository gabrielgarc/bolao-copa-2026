version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'no-store'
  # SPA redirect: todas as rotas não encontradas voltam para index.html
  # Isso permite que /bolao-adm e qualquer outra rota do React funcionem
  # mesmo ao acessar diretamente pelo browser (deep link / F5).
  redirects:
    - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|jpeg|js|png|svg|txt|webp|woff|woff2|ttf|map|json)$)([^.]+$)/>'
      target: /index.html
      status: '200'
